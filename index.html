<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Happy Girlfriend's Day ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ⭐ Background -->
    <div id="stars"></div>

    <!-- 🌙 Intro -->
    <section id="intro" class="scene active">

        <h1 class="line1">
            Every love story begins somewhere...
        </h1>

        <h2 class="line2">
            Ours began with a single message.
        </h2>

        <button id="startButton">
            Begin ❤️
        </button>

    </section>

    <!-- ❤️ Quantum Heart -->
<section id="heartScene" class="scene">

    <canvas id="heartCanvas"></canvas>

    <h1 id="heartMessage">
        And somehow... I found you ❤️
    </h1>

</section>

    <!-- 💌 I Love You Heart -->
<section id="loveScene" class="scene">

    <div class="loveHeart">

        <div class="glowHeart"></div>

        <h1>
            I LOVE YOU ❤️
        </h1>

    </div>

</section>

    <!-- 💐 Bouquet -->
<section id="bouquetScene" class="scene">

    <div class="bigBouquet">

        <div class="stems"></div>

        <div class="leaf leaf1"></div>
        <div class="leaf leaf2"></div>
        <div class="leaf leaf3"></div>
        <div class="leaf leaf4"></div>


        <div class="lily l1"></div>
        <div class="lily l2"></div>
        <div class="lily l3"></div>
        <div class="lily l4"></div>
        <div class="lily l5"></div>
        <div class="lily l6"></div>
        <div class="lily l7"></div>
        <div class="lily l8"></div>
        <div class="lily l9"></div>


        <div class="ribbon"></div>

    </div>


    <h1 class="bouquetText">
        For the person who makes my world bloom 💙
    </h1>

</section>

    <!-- 💌 Letter -->
  <section id="letterScene" class="scene">

    <div class="envelope">

        <div class="flap"></div>

        <div class="letter">

            <h2>
                My Love ❤️
            </h2>

    <div id="typedLetter"></div>

<h3 id="signature">
    Forever yours,<br>
    Adwait ❤️
</h3>

        </div>

    </div>

</section>

    <!-- 📸 Ending -->
    <section id="endingScene" class="scene">

    </section>

  <script src="js/quantumHeart.js"></script>
  <script src="script.js"></script>

</body>

</html>
